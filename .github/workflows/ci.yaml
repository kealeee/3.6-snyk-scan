name: CI Checks

on:
  pull_request:
    branches: [main]

jobs:
  Initial-Checks:
    runs-on: ubuntu-latest
    steps:
      - name: Show who triggered and from which branch
        run: |
          echo "Triggered by: ${{ github.actor }}"
          echo "Branch: ${{ github.head_ref }}"

  terraform-checks:
    runs-on: ubuntu-latest
    needs: Initial-Checks
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: |
          tflint --init
          tflint -f compact

  snyk-checks:
    runs-on: ubuntu-latest
    needs: Initial-Checks
    steps:
      - uses: actions/checkout@v4

      - name: Snyk IaC scan (Terraform misconfigurations)
        uses: snyk/actions/iac@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  summary:
    runs-on: ubuntu-latest
    needs: [terraform-checks, snyk-checks]
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| terraform-checks | ${{ needs.terraform-checks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| snyk-checks | ${{ needs.snyk-checks.result }} |" >> $GITHUB_STEP_SUMMARY